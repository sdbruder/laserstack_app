name: nightly publish

on:
  schedule:
    # every night, 22:23 UTC: off the hour, because GitHub queues a scheduled run
    # instead of starting it and the top of the hour is the worst time to ask.
    # The runs of 11-19 November, at 01:00 and then at 00:23, all started between
    # 07:27 and 08:54 UTC, six to eight hours late, so asking two hours earlier is
    # what publishes two hours earlier: the queue delay does not shrink.
    - cron: "23 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      # same names the build script reads from .env
      HUB_USER: ${{ secrets.HUB_USER }}
      HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
      BUILDX_CACHE: gha
      # keep laserstack/app:latest on a released series: 8.6 is a release
      # candidate, and without this line the newest directory would take it
      APP_LATEST: 8.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: check the docker hub secrets
        run: |
          if [ -z "${HUB_USER}" ] || [ -z "${HUB_PASSWORD}" ]; then
            echo "::error::add the repository secrets HUB_USER and HUB_PASSWORD (Docker Hub user name and access token)"
            exit 1
          fi

      - name: set up qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: build and publish every image
        run: ./buildx.sh
