# One app, one fixed domain, plain HTTP on port 80.
# Install: /etc/nginx/http.d/00-single-app.conf
#
# Change the two values below, the domain and the document root. Nothing else
# in this file is application specific.

server {
	listen       80 default_server;
	server_name  app.example.com;

	root   /var/www/app/public;
	index  index.php index.html;
	charset  utf-8;

	# The php snippet reads this variable. $https is "on" with TLS here and
	# empty without it, which is what PHP expects.
	set  $app_https  $https;

	# CSP is application specific. Add it when the app is ready for it.
	include  /etc/nginx/snippets/security-headers.conf;

	# Dotfiles first: .env, .git and friends must never be served.
	location ~ /\.(?!well-known/) {
		deny  all;
		access_log  off;
		log_not_found  off;
	}

	include  /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files  $uri  /index.php?$query_string;
	}

	include  /etc/nginx/snippets/php-fpm.conf;

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }
}
