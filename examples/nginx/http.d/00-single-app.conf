# One app, one fixed domain, plain HTTP.
# Install: /etc/nginx/http.d/00-single-app.conf
#
# Port 8080, not 80: the container runs as a non-root user, which cannot bind a
# port below 1024. Publish it as you like, for example `-p 80:8080`.

server {
	listen       8080 default_server;
	server_name  app.example.com;

	# $https is "on" with TLS and empty without it, which is what PHP expects.
	set  $app_https  $https;

	include  /etc/nginx/snippets/server-body.conf;
}
