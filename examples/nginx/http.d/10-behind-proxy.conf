# A load balancer terminates TLS and forwards plain HTTP to this container.
# Install: /etc/nginx/http.d/10-behind-proxy.conf
#
# Two things must be right, or the app builds http:// links and logs the
# address of the load balancer instead of the client address:
#   - the client address comes from X-Forwarded-For
#   - the scheme comes from X-Forwarded-Proto
#
# map is allowed here: files in http.d are included inside the http block.

map $http_x_forwarded_proto $forwarded_https {
	default  "";
	https    "on";
}

server {
	listen       8080;
	server_name  app-lb.example.com;

	# Replace with the load balancer addresses. Never use 0.0.0.0/0: then
	# any client forges its own address with the header.
	set_real_ip_from   10.0.0.0/8;
	real_ip_header     X-Forwarded-For;
	real_ip_recursive  on;

	set  $app_https  $forwarded_https;

	include  /etc/nginx/snippets/server-body.conf;
}

# Strict-Transport-Security is not set here. A browser ignores it over plain
# HTTP, so the load balancer sets it on the TLS side.
