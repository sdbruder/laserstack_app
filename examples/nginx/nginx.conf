# Production main config for the laserstack/app image.
# Install: /etc/nginx/nginx.conf
#
# Differences from the Alpine default that ships in the image:
#   - the access log and the error log go to the container streams, so
#     `docker logs` and the log driver see them
#   - client_max_body_size is 100M, to match php.ini of this image; the
#     Alpine default is 1m and answers 413 to a larger upload
#   - gzip is on, worker_connections is 4096, TLS 1.0 and 1.1 are off

# No `user` directive. The overlay runs the container as a non-root user, where
# nginx cannot change the identity of its workers and must not try. A container
# started as root would run its workers as root instead, so run it as the app
# user.

worker_processes  auto;
worker_rlimit_nofile  65535;
pcre_jit  on;

# Writable paths in /tmp: a non-root user cannot write to /run or
# /var/lib/nginx.
pid  /tmp/nginx.pid;

error_log  /dev/stderr  warn;

include /etc/nginx/modules/*.conf;

# Root context snippets. No main-context directive of this file may be
# repeated here, nginx rejects a duplicate.
include /etc/nginx/conf.d/*.conf;

events {
	worker_connections  4096;
	multi_accept  on;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	server_tokens  off;

	# php.ini of this image sets post_max_size and upload_max_filesize to
	# 100M. Keep the two in step, or uploads fail here before PHP sees them.
	client_max_body_size  100M;

	sendfile      on;
	tcp_nopush    on;
	tcp_nodelay   on;
	keepalive_timeout  30;

	client_body_temp_path  /tmp/nginx-client-body;
	proxy_temp_path        /tmp/nginx-proxy;
	fastcgi_temp_path      /tmp/nginx-fastcgi;
	uwsgi_temp_path        /tmp/nginx-uwsgi;
	scgi_temp_path         /tmp/nginx-scgi;

	gzip  on;
	gzip_vary  on;
	gzip_comp_level  5;
	gzip_min_length  1024;
	gzip_proxied  any;
	gzip_types  text/plain text/css text/xml application/javascript
	            application/json application/xml image/svg+xml;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" '
	                  '"$http_user_agent" $request_time '
	                  '"$http_x_forwarded_for"';

	# Container streams. A file log inside the container grows without a
	# limit: the image has no logrotate, and it stays out of `docker logs`.
	access_log  /dev/stdout  main;

	ssl_protocols  TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers  off;
	ssl_session_cache  shared:SSL:10m;
	ssl_session_timeout  1h;
	ssl_session_tickets  off;

	map $http_upgrade $connection_upgrade {
		default  upgrade;
		''       close;
	}

	include /etc/nginx/http.d/*.conf;
}
