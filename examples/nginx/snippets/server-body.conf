# The body of an application server block, shared by every vhost.
# Install: /etc/nginx/snippets/server-body.conf
#
# The vhost sets $app_https before this include, then adds its own listen,
# server_name and, for a balancer, the real_ip directives.
#
# The app lives at /var/www/app/public. Change the root here if your app does
# not, and nowhere else.

	root   /var/www/app/public;
	index  index.php index.html;
	charset  utf-8;

	# CSP is application specific. Add it when the app is ready for it.
	include  /etc/nginx/snippets/security-headers.conf;

	# Dotfiles first: .env, .git and friends must never be served.
	location ~ /\.(?!well-known/) {
		deny  all;
		access_log  off;
		log_not_found  off;
	}

	include  /etc/nginx/snippets/static-assets.conf;

	location / {
		try_files  $uri  /index.php?$query_string;
	}

	include  /etc/nginx/snippets/php-fpm.conf;

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }
