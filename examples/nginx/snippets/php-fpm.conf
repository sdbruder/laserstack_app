# The PHP handler. Install: /etc/nginx/snippets/php-fpm.conf
# php-fpm of this image listens on 127.0.0.1:9000, in the same container.
#
# The server block that includes this file must define $app_https first, for
# example `set $app_https $https;` or `set $app_https $forwarded_https;`.
# nginx then fails `nginx -t` when a vhost forgets it, which is wanted.

location ~ \.php$ {
	# No script that does not exist. Without this line a request such as
	# /index.php/foo reaches php-fpm with PATH_INFO set.
	try_files  $uri  =404;

	include  /etc/nginx/fastcgi.conf;

	# fastcgi.conf sets HTTPS from $https, which is wrong behind a load
	# balancer that terminates TLS. The later parameter wins in PHP.
	fastcgi_param  HTTPS  $app_https;

	fastcgi_pass   127.0.0.1:9000;
	fastcgi_index  index.php;

	fastcgi_read_timeout  60s;
	fastcgi_buffers  16 16k;
	fastcgi_buffer_size  32k;
}
