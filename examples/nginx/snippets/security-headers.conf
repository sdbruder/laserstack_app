# Baseline security headers for a single app.
# Install: /etc/nginx/snippets/security-headers.conf
#
# `always` makes nginx send the header on error responses too. The CSP stays
# out on purpose: it is application specific.

add_header  X-Content-Type-Options  "nosniff"                             always;
add_header  X-Frame-Options         "SAMEORIGIN"                           always;
add_header  Referrer-Policy         "strict-origin-when-cross-origin"      always;
add_header  Permissions-Policy      "geolocation=(), microphone=(), camera=()"  always;

# Note: an add_header inside a location cancels every add_header that the
# server block inherited. Add the headers again in that location, or keep the
# location free of add_header, as the examples do.
