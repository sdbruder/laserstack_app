# Long-lived static files. Install: /etc/nginx/snippets/static-assets.conf
#
# `expires` writes both Expires and Cache-Control, so no add_header here:
# that would cancel the security headers of the server block.
# Fingerprinted file names (app.4f3a91.css) can use `expires 1y;` instead.

location ~* \.(?:css|js|mjs|map|jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|pdf)$ {
	expires  30d;
	access_log  off;
	try_files  $uri  =404;
}
