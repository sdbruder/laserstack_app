; Production PHP settings of the overlay.
; Install: /etc/php<abi>/conf.d/zz-prod.ini, read after laser.ini of the base
; image.
;
; Xdebug is not present in this image at all: prod/Dockerfile removes the
; package, comments the zend_extension line of laser.ini and comments its
; xdebug.* keys. display_errors, log_errors and error_reporting are already at
; their production values.

[PHP]
; The base image puts PHP/8.5.12 into an X-Powered-By header of every response.
expose_php = Off
