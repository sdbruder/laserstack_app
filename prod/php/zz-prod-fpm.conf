; Production php-fpm settings of the overlay.
; Install: /etc/php<abi>/php-fpm.d/zz-prod.conf
;
; The image reads its own www.conf first, then this file. A second [www]
; section updates the same pool, so these values win.

[global]
; php-fpm logs to the container stream and keeps its pid file in /tmp: a
; non-root user cannot write to /var/log or /run.
error_log = /dev/stderr
pid = /tmp/php-fpm.pid

[www]
; The same user as the container. As root, php-fpm drops the workers to it.
user = app
group = app

; www.conf of the image, 5, fits a laptop. PHP_MAX_CHILDREN of the build sets
; the number of concurrent requests the host can serve.
pm.max_children = __MAX_CHILDREN__
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
