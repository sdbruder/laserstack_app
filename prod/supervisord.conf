; supervisord for a container that runs as a non-root user.
; Install: /etc/supervisord.conf
;
; No user= directive anywhere: the container user has no privilege to drop, and
; supervisord refuses to start when one is set. The socket, the pid file and
; the child logs go to /tmp, which is writable.

[supervisord]
nodaemon=true
; supervisord mirrors its messages to the container stream in the foreground.
; A file log here would only duplicate them, and one inside a non-root
; container would also grow in the writable layer.
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[program:php]
; /usr/local/bin/php-fpm is the symlink that prod/Dockerfile makes. Without
; --fpm-config it reads /etc/php<abi>/php-fpm.conf, which is its default.
command=php-fpm --nodaemonize
autostart=true
autorestart=true
environment=LASER="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; -e /dev/stderr points the initial error log at the container stream. Without
; it, a non-root nginx cannot open its compiled-in default, /var/lib/nginx/logs,
; and prints an alert on every start.
command=nginx -g "daemon off;" -e /dev/stderr
autostart=true
autorestart=true
environment=LASER="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
